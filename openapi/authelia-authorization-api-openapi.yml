openapi: 3.2.0
info:
  title: Authelia Authorization API
  description: Authelia is an open-source authentication and authorization server and portal fulfilling the identity and access management (IAM) role of information security in providing multi-factor authentication and single sign-on (SSO) for your applications via a web portal. Authelia is an OpenID Connect 1.0 Provider which is OpenID Certified™ allowing comprehensive integrations, and acts as a companion for common reverse proxies.
  contact:
    name: Support
    url: https://www.authelia.com/contact/
    email: team@authelia.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: https://auth.example.com
  description: Authelia API
tags:
- name: Authorization
  description: Authorization endpoints
paths:
  /api/authz/auth-request:
    get:
      operationId: getAuthzAuthRequest
      tags:
      - Authorization
      summary: Authorization Verification (AuthRequest)
      description: The AuthRequest authorization verification endpoint provides the ability to verify if a user has the necessary permissions to access a specified resource with the HAPROXY, NGINX, or NGINX-based proxies.
      parameters:
      - $ref: '#/components/parameters/originalMethodParam'
      - $ref: '#/components/parameters/originalURLParam'
      responses:
        '200':
          description: Successful Operation
          headers:
            remote-user:
              description: Username
              schema:
                type: string
                examples:
                - john
            remote-name:
              description: Name
              schema:
                type: string
                examples:
                - John Doe
            remote-email:
              description: Email
              schema:
                type: string
                examples:
                - john.doe@authelia.com
            remote-groups:
              description: Comma separated list of Groups
              schema:
                type: string
                examples:
                - admin,devs
            set-cookie:
              description: Sets a new cookie value
              schema:
                type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
          headers:
            location:
              description: Redirect Location for user authorization
              example: https://auth.example.com/?rd=https%3A%2F%2Fapp.example.com&rm=GET
              schema:
                type: string
                format: uri
            set-cookie:
              description: Sets a new cookie value
              schema:
                type: string
      security:
      - authelia_auth: []
    head:
      operationId: headAuthzAuthRequest
      tags:
      - Authorization
      summary: Authorization Verification (AuthRequest)
      description: The AuthRequest authorization verification endpoint provides the ability to verify if a user has the necessary permissions to access a specified resource with the HAPROXY, NGINX, or NGINX-based proxies.
