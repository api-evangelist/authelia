            responses (content key encryption).

            '
          type: array
          examples:
          - - RSA1_5
            - RSA-OAEP
            - RSA-OAEP-256
            - A128KW
            - A192KW
            - A256KW
            - dir
            - ECDH-ES
            - ECDH-ES+A128KW
            - ECDH-ES+A192KW
            - ECDH-ES+A256KW
            - A128GCMKW
            - A192GCMKW
            - A256GCMKW
            - PBES2-HS256+A128KW
            - PBES2-HS384+A192KW
            - PBES2-HS512+A256KW
          items:
            $ref: '#/components/schemas/jose.spec.JWE.alg'
        introspection_encryption_enc_values_supported:
          description: 'OPTIONAL. JSON array containing a list of the JWE [RFC7516] encryption algorithms (enc values), as
            defined in JWA [RFC7518], supported by the introspection endpoint to encrypt the response (content encryption).

            '
          type: array
          examples:
          - - A128CBC-HS256
            - A192CBC-HS384
            - A256CBC-HS512
            - A128GCM
            - A192GCM
            - A256GCM
          items:
            $ref: '#/components/schemas/jose.spec.JWE.enc'
    openid.spec.ResponseMode:
      description: 'Informs the Authorization Server of the mechanism to be used for returning parameters from the Authorization
        Endpoint. This use of this parameter is NOT RECOMMENDED when the Response Mode that would be requested is the default
        mode specified for the Response Type.

        '
      enum:
      - form_post
      - query
      - fragment
      - jwt
      - form_post.jwt
      - query.jwt
      - fragment.jwt
      examples:
      - query
      type: string
    jose.spec.JWK.base:
      type: object
      properties:
        use:
          description: 'The "use" (public key use) parameter identifies the intended use of the public key. The "use" parameter
            is employed to indicate whether a public key is used for encrypting data or verifying the signature on data.

            '
          enum:
          - sig
          - enc
          examples:
          - sig
          type: string
        key_ops:
          description: 'The "key_ops" (key operations) parameter identifies the operation(s) for which the key is intended
            to be used. The "key_ops" parameter is intended for use cases in which public, private, or symmetric keys may
            be present.

            '
          examples:
          - - sign
          type: array
          items:
            enum:
            - sign
            - verify
            - encrypt
            - decrypt
            - wrapKey
            - unwrapKey
            - deriveKey
            - deriveBits
            type: string
        kid:
          description: 'The "kid" (key ID) parameter is used to match a specific key. This is used, for instance, to choose
            among a set of keys within a JWK Set during key rollover. The structure of the "kid" value is unspecified. When
            "kid" values are used within a JWK Set, different keys within the JWK Set SHOULD use distinct "kid" values. (One
            example in which different keys might use the same "kid" value is if they have different "kty" (key type) values
            but are considered to be equivalent alternatives by the application using them.) The "kid" value is a case-sensitive
            string. Use of this member is OPTIONAL. When used with JWS or JWE, the "kid" value is used to match a JWS or JWE
            "kid" Header Parameter value.

            '
          type: string
        x5u:
          description: 'The "x5u" (X.509 URL) parameter is a URI [RFC3986] that refers to a resource for an X.509 public key
            certificate or certificate chain [RFC5280]. The identified resource MUST provide a representation of the certificate
            or certificate chain that conforms to RFC 5280 [RFC5280] in PEM-encoded form, with each certificate delimited
            as specified in Section 6.1 of RFC 4945 [RFC4945]. The key in the first certificate MUST match the public key
            represented by other members of the JWK. The protocol used to acquire the resource MUST provide integrity protection;
            an HTTP GET request to retrieve the certificate MUST use TLS [RFC2818] [RFC5246]; the identity of the server MUST
            be validated, as per Section 6 of RFC 6125 [RFC6125]. Use of this member is OPTIONAL.

            '
          type: string
        x5c:
          description: 'The "x5c" (X.509 certificate chain) parameter contains a chain of one or more PKIX certificates [RFC5280].
            The certificate chain is represented as a JSON array of certificate value strings. Each string in the array is
            a base64-encoded (Section 4 of [RFC4648] -- not base64url-encoded) DER [ITU.X690.1994] PKIX certificate value.
            The PKIX certificate containing the key value MUST be the first certificate. This MAY be followed by additional
            certificates, with each subsequent certificate being the one used to certify the previous one. The key in the
            first certificate MUST match the public key represented by other members of the JWK. Use of this member is OPTIONAL.

            '
          type: array
          items:
            contentEncoding: base64
            type: string
        x5t:
          description: 'The "x5t" (X.509 certificate SHA-1 thumbprint) parameter is a base64url-encoded SHA-1 thumbprint (a.k.a.
            digest) of the DER encoding of an X.509 certificate [RFC5280]. Note that certificate thumbprints are also sometimes
            known as certificate fingerprints. The key in the certificate MUST match the public key represented by other members
            of the JWK. Use of this member is OPTIONAL.

            '
          contentEncoding: base64url
          type: string
        x5t#S256:
          description: 'The "x5t#S256" (X.509 certificate SHA-256 thumbprint) parameter is a base64url-encoded SHA-256 thumbprint
            (a.k.a. digest) of the DER encoding of an X.509 certificate [RFC5280]. Note that certificate thumbprints are also
            sometimes known as certificate fingerprints. The key in the certificate MUST match the public key represented
            by other members of the JWK. Use of this member is OPTIONAL.

            '
          contentEncoding: base64url
          type: string
    openid.spec.ClientAuthMethod:
      description: The OAuth 2.0 / OpenID Connect 1.0 Client Authentication Method.
      enum:
      - none
      - client_secret_post
      - client_secret_basic
      - client_secret_jwt
      - private_key_jwt
      - tls_client_auth
      - self_signed_tls_client_auth
      type: string
    openid.implementation.Claims.Name:
      description: The name of an OpenID Connect 1.0 Claim.
      type: string
      enum:
      - amr
      - aud
      - azp
      - client_id
      - exp
      - iat
      - iss
      - jti
      - rat
      - auth_time
      - nonce
      - groups
      - sub
      - name
      - given_name
      - family_name
      - middle_name
      - nickname
      - preferred_username
      - profile
      - picture
      - website
      - email
      - email_verified
      - alt_emails
      - gender
      - birthdate
      - zoneinfo
      - locale
      - phone_number
      - phone_number_verified
      - address
      - updated_at
    jose.spec.JWK.RSA:
      description: RSA Public Key in JSON Web Key format as defined by RFC7517 and RFC7518.
      allOf:
      - $ref: '#/components/schemas/jose.spec.JWK.base'
      - required:
        - kty
        - n
        - e
        type: object
        properties:
          kty:
            description: 'The "kty" (key type) parameter identifies the cryptographic algorithm family used with the key.

              '
            type: string
            examples:
            - RSA
            enum:
            - RSA
          alg:
            description: The JSON Web Signature Algorithm
            type: string
            examples:
            - RS256
            enum:
            - RS256
            - RS384
            - RS512
            - PS256
            - PS384
            - PS512
          n:
            description: 'RSA Public Key: The "n" (modulus) parameter contains the modulus value for the RSA public key. It
              is represented as a Base64urlUInt-encoded value.

              '
            type: string
            contentEncoding: base64url
          e:
            description: 'RSA Public Key: The "e" (exponent) parameter contains the exponent value for the RSA public key.
              It is represented as a Base64urlUInt-encoded value.

              '
            type: string
            contentEncoding: base64url
    jose.spec.JWK.EC.Private:
      description: Elliptic Curve Private Key in JSON Web Key format as defined by RFC7517 and RFC7518.
      allOf:
      - $ref: '#/components/schemas/jose.spec.JWK.base'
      - $ref: '#/components/schemas/jose.spec.JWK.EC'
      - type: object
        required:
        - d
        properties:
          d:
            description: 'ECC Private Key: The "d" (ECC private key) parameter contains the Elliptic Curve private key value.
              It is represented as the base64url encoding of the octet string representation of the private key value, as
              defined in Section 2.3.7 of SEC1 [SEC1]. The length of this octet string MUST be ceiling(log-base-2(n)/8) octets
              (where n is the order of the curve).

              '
            type: string
            contentEncoding: base64url
    openid.spec.CodeChallengeMethod:
      description: The RFC7636 Code Challenge Verifier Method.
      enum:
      - plain
      - S256
      examples:
      - S256
      type: string
    openid.spec.Scopes:
      type: string
      enum:
      - openid
      - offline_access
      - profile
      - email
      - address
      - phone
    jose.spec.JWK.RSA.Private:
      description: RSA Private Key in JSON Web Key format as defined by RFC7517 and RFC7518.
      allOf:
      - $ref: '#/components/schemas/jose.spec.JWK.base'
      - $ref: '#/components/schemas/jose.spec.JWK.RSA'
      - type: object
        required:
        - d
        properties:
          d:
            description: 'RSA Private Key: The "d" (private exponent) parameter contains the private exponent value for the
              RSA private key. It is represented as a Base64urlUInt-encoded value.

              '
            type: string
            contentEncoding: base64url
          p:
            description: 'RSA Private Key: The "p" (first prime factor) parameter contains the first prime factor. It is represented
              as a Base64urlUInt-encoded value.

              '
            type: string
            contentEncoding: base64url
          q:
            description: 'RSA Private Key: The "q" (second prime factor) parameter contains the second prime factor. It is
              represented as a Base64urlUInt-encoded value.

              '
            type: string
            contentEncoding: base64url
          dp:
            description: 'RSA Private Key: The "dp" (first factor CRT exponent) parameter contains the Chinese Remainder Theorem
              (CRT) exponent of the first factor. It is represented as a Base64urlUInt-encoded value.

              '
            type: string
          dq:
            description: 'RSA Private Key: The "dq" (second factor CRT exponent) parameter contains the CRT exponent of the
              second factor. It is represented as a Base64urlUInt-encoded value.

              '
            type: string
          qi:
            description: 'RSA Private Key: The "qi" (first CRT coefficient) parameter contains the CRT coefficient of the
              second factor. It is represented as a Base64urlUInt-encoded value.

              '
            type: string
            contentEncoding: base64url
          oth:
            description: 'The "oth" (other primes info) parameter contains an array of information about any third and subsequent
              primes, should they exist.

              '
            type: array
            items:
              type: object
              required:
              - r
              - d
              - t
              properties:
                r:
                  description: 'The "r" (prime factor) parameter within an "oth" array member represents the value of a subsequent
                    prime factor. It is represented as a Base64urlUInt-encoded value.

                    '
                  type: string
                  contentEncoding: base64url
                d:
                  description: 'The "d" (factor CRT exponent) parameter within an "oth" array member represents the CRT exponent
                    of the corresponding prime factor. It is represented as a Base64urlUInt-encoded value.

                    '
                  type: string
                  contentEncoding: base64url
                t:
                  description: 'The "t" (factor CRT coefficient) parameter within an "oth" array member represents the CRT
                    coefficient of the corresponding prime factor. It is represented as a Base64urlUInt-encoded value.

                    '
                  type: string
                  contentEncoding: base64url
    openid.spec.SubjectIdentifier:
      description: 'A Subject Identifier is a locally unique and never reassigned identifier within the Issuer for the End-User,
        which is intended to be consumed by the Client.

        '
      enum:
      - public
      - pairwise
      type: string
    jose.spec.JWKs:
      type: object
      description: The JSON Web Key Sets Document as defined by RFC7517.
      properties:
        keys:
          description: List of JSON Wek Key's in the JSON Web Key format as defined by RFC7517.
          type: array
          items:
            $ref: '#/components/schemas/jose.spec.JWK'
    openid.spec.DisplayType:
      description: 'ASCII string value that specifies how the Authorization Server displays the authentication and consent
        user interface pages to the End-User.

        '
      enum:
      - page
      - popup
      - touch
      - wap
      examples:
      - page
      type: string
    openid.spec.GrantType:
      description: The OAuth 2.0 / OpenID Connect 1.0 Grant Type.
      enum:
      - authorization_code
      - refresh_token
      - implicit
      - client_credentials
      - urn:ietf:params:oauth:grant-type:device_code
      examples:
      - authorization_code
      type: string
    jose.spec.JWK:
      description: A key in the JSON Web Key format as defined by RFC7517.
      anyOf:
      - $ref: '#/components/schemas/jose.spec.JWK.RSA'
      - $ref: '#/components/schemas/jose.spec.JWK.RSA.Private'
      - $ref: '#/components/schemas/jose.spec.JWK.EC'
      - $ref: '#/components/schemas/jose.spec.JWK.EC.Private'
      - $ref: '#/components/schemas/jose.spec.JWK.Symmetric'
    jose.spec.JWE.enc:
      description: The JSON Web Encryption Algorithm (Claims)
      enum:
      - A128CBC-HS256
      - A192CBC-HS384
      - A256CBC-HS512
      - A128GCM
      - A192GCM
      - A256GCM
      type: string
    openid.implementation.Scopes.Object:
      description: The scope.
      type: string
      oneOf:
      - $ref: '#/components/schemas/openid.spec.Scopes'
      - type: string
        enum:
        - groups
    openid.spec.Prompt:
      description: 'Not Supported: Space delimited, case sensitive list of ASCII string values that specifies whether the
        Authorization Server prompts the End-User for reauthentication and consent.

        '
      enum:
      - none
      - login
      - consent
      - select_account
      - login consent
      - login select_account
      - consent select_account
      examples:
      - none
      type: string
