            - HS512
            - RS256
            - RS384
            - RS512
            - PS256
            - PS384
            - PS512
            - ES256
            - ES384
            - ES512
            - none
          items:
            $ref: '#/components/schemas/jose.spec.JWS.None'
        userinfo_encryption_alg_values_supported:
          description: 'JSON array containing a list of the JWE [JWE] encryption algorithms (alg values) [JWA] supported by
            the UserInfo Endpoint to encode the Claims in a JWT [JWT]. See Also: JWE: https://datatracker.ietf.org/doc/html/rfc7516
            JWA: https://datatracker.ietf.org/doc/html/rfc7518 JWT: https://datatracker.ietf.org/doc/html/rfc7519

            '
          type: array
          examples:
          - - RSA1_5
            - RSA-OAEP
            - RSA-OAEP-256
            - A128KW
            - A192KW
            - A256KW
            - dir
            - ECDH-ES
            - ECDH-ES+A128KW
            - ECDH-ES+A192KW
            - ECDH-ES+A256KW
            - A128GCMKW
            - A192GCMKW
            - A256GCMKW
            - PBES2-HS256+A128KW
            - PBES2-HS384+A192KW
            - PBES2-HS512+A256KW
          items:
            $ref: '#/components/schemas/jose.spec.JWE.alg'
        userinfo_encryption_enc_values_supported:
          description: 'JSON array containing a list of the JWE encryption algorithms (enc values) [JWA] supported by the
            UserInfo Endpoint to encode the Claims in a JWT [JWT]. See Also: JWE: https://datatracker.ietf.org/doc/html/rfc7516
            JWA: https://datatracker.ietf.org/doc/html/rfc7518 JWT: https://datatracker.ietf.org/doc/html/rfc7519

            '
          type: array
          examples:
          - - A128CBC-HS256
            - A192CBC-HS384
            - A256CBC-HS512
            - A128GCM
            - A192GCM
            - A256GCM
          items:
            $ref: '#/components/schemas/jose.spec.JWE.enc'
        authorization_signing_alg_values_supported:
          description: 'OPTIONAL. A JSON array containing a list of the JWS [RFC7515] signing algorithms (alg values) supported
            by the authorization endpoint to sign the response.

            '
          type: array
          examples:
          - - RS256
          items:
            $ref: '#/components/schemas/jose.spec.JWS'
        authorization_encryption_alg_values_supported:
          description: 'OPTIONAL. A JSON array containing a list of the JWE [RFC7516] encryption algorithms (alg values) supported
