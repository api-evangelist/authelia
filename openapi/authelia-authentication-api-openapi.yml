              description: The default algorithm for the generated configuration.
              type: string
              examples:
              - SHA1
            algorithms:
              default:
              - SHA1
              description: The allowed algorithm values for the generated configuration.
              examples:
              - - SHA1
              type: array
              items:
                type: string
            length:
              default: 6
              description: The default length (number of digits) value for the generated configuration.
              type: integer
              examples:
              - 6
            lengths:
              default:
              - 6
              description: The allowed length (number of digits) values for the generated configuration.
              examples:
              - - 6
                - 8
              type: array
              items:
                type: integer
            period:
              default: 30
              description: The default period value for the generated configuration.
              type: integer
              examples:
              - 30
            periods:
              default:
              - 30
              description: The allowed period values for the generated configuration.
              examples:
              - - 30
              type: array
              items:
                type: integer
