openapi: 3.2.0
info:
  title: Authelia Authentication API
  description: Authelia is an open-source authentication and authorization server and portal fulfilling the identity and access management (IAM) role of information security in providing multi-factor authentication and single sign-on (SSO) for your applications via a web portal. Authelia is an OpenID Connect 1.0 Provider which is OpenID Certified™ allowing comprehensive integrations, and acts as a companion for common reverse proxies.
  contact:
    name: Support
    url: https://www.authelia.com/contact/
    email: team@authelia.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: https://auth.example.com
  description: Authelia API
tags:
- name: Authentication
  description: Authentication endpoints
paths:
  /api/firstfactor:
    post:
      operationId: postFirstFactor
      tags:
      - Authentication
      summary: Login
      description: The firstfactor endpoint allows a user to login and generates an authentication cookie for authorization.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.bodyFirstFactorRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.redirectResponse'
        '401':
          description: Unauthorized
  /api/firstfactor/reauthenticate:
    post:
      operationId: postFirstFactorReauthenticate
      tags:
      - Authentication
      summary: Reauthenticate
      description: The firstfactor reauthenticate endpoint allows an already authenticated user to prove they still know their password without providing their username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.bodyFirstFactorReauthenticateRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.redirectResponse'
        '401':
          description: Unauthorized
      security:
      - authelia_auth: []
  /api/firstfactor/passkey:
    get:
      operationId: getFirstFactorPasskey
      tags:
      - Authentication
      summary: First Factor Authentication - Passkey
      description: The WebAuthn endpoint starts the first factor authentication process with the FIDO2 WebAuthn credential.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthn.PublicKeyCredentialRequestOptions'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
    post:
      operationId: postFirstFactorPasskey
      tags:
      - Authentication
      summary: First Factor Authentication - Passkey
      description: The WebAuthn endpoint completes the first factor authentication process with the FIDO2 WebAuthn credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthn.PasskeyCredentialAssertionResponse'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.redirectResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
  /api/logout:
    post:
      operationId: postLogout
      tags:
      - Authentication
      summary: Logout
      description: The logout endpoint allows a user to logout and destroy a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.logoutRequestBody'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.logoutResponseBody'
      security:
      - authelia_auth: []
  /api/secondfactor/totp/register:
    get:
      operationId: getSecondFactorTOTPRegistration
      tags:
      - Authentication
      summary: TOTP Configuration Register
      description: The TOTP register endpoint provides information important for registering the TOTP configuration for the user. This endpoint only returns information used for this same endpoint when utilizing the PUT method verb.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TOTPOptions'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    put:
      operationId: putSecondFactorTOTPRegistration
      tags:
      - Authentication
      summary: TOTP Configuration Register
      description: The TOTP register endpoint creates a temporary TOTP configuration which must then be validated by the user using the POST method verb variant of this endpoint. Without validation the TOTP configuration is not committed to the database and is instead temporarily stored in the session backend. This action can also be followed by using the DELETE method verb for the same endpoint which will delete the temporary configuration from the session.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.TOTPRegisterStartRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TOTPRegisterStartResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    post:
      operationId: postSecondFactorTOTPRegistration
      tags:
      - Authentication
      summary: TOTP Configuration Register
      description: The TOTP register endpoint provides the validation step for the endpoint where the user provides the TOTP configuration generated token. If successful the configuration is saved to the database.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.TOTPRegisterFinishRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    delete:
      operationId: deleteSecondFactorTOTPRegistration
      tags:
      - Authentication
      summary: TOTP Configuration Register
      description: The TOTP register endpoint removes the temporary TOTP configuration from the session. It does NOT affect the TOTP configuration saved to the database.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
  /api/secondfactor/totp:
    get:
      operationId: getSecondFactorTOTPConfiguration
      tags:
      - Authentication
      summary: TOTP Configuration
      description: The TOTP endpoint provides information necessary to display the TOTP component to validate their TOTP input such as the period and number of digits.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TOTPConfiguration'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    post:
      operationId: postSecondFactorTOTP
      tags:
      - Authentication
      summary: Second Factor Authentication - TOTP
      description: The TOTP endpoint performs second factor authentication with a TOTP configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.bodySignTOTPRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.redirectResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
          headers:
            Retry-After:
              schema:
                type: string
                format: http-date
              description: The date time that the request can be retried.
      security:
      - authelia_auth: []
    delete:
      operationId: deleteSecondFactorTOTP
      tags:
      - Authentication
      summary: Second Factor Authentication - TOTP
      description: The TOTP endpoint deletes the TOTP configuration for the user from the database.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
  /api/secondfactor/webauthn:
    get:
      operationId: getSecondFactorWebAuthn
      tags:
      - Authentication
      summary: Second Factor Authentication - WebAuthn
      description: The WebAuthn endpoint starts the second factor authentication process with the FIDO2 WebAuthn credential.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthn.PublicKeyCredentialRequestOptions'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    post:
      operationId: postSecondFactorWebAuthn
      tags:
      - Authentication
      summary: Second Factor Authentication - WebAuthn
      description: The WebAuthn endpoint completes the second factor authentication process with the FIDO2 WebAuthn credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthn.CredentialAssertionResponse'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.redirectResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
  /api/secondfactor/webauthn/credentials:
    get:
      operationId: getSecondFactorWebAuthnCredentials
      tags:
      - Authentication
      summary: WebAuthn Credentials
      description: The WebAuthn credentials endpoint returns the list of WebAuthn credentials registered by the user.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthn.CredentialsResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
  /api/secondfactor/webauthn/credential/register:
    put:
      operationId: putSecondFactorWebAuthnCredentialRegistration
      tags:
      - Authentication
      summary: WebAuthn Credential Registration (Attestation)
      description: The WebAuthn Register endpoint checks the intended description is okay and provides the relevant credential creation options, and stores the creation options for a validation via the same endpoint with the POST method verb.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthn.RegisterRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webauthn.PublicKeyCredentialCreationOptions'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    post:
      operationId: postSecondFactorWebAuthnCredentialRegistration
      tags:
      - Authentication
      summary: WebAuthn Credential Registration (Attestation)
      description: The WebAuthn Register endpoint validates the authenticators response and finalizes the WebAuthn registration. The description for the credential is the one supplied to the PUT method verb for this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthn.PublicKeyCredentialAttestation'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    delete:
      operationId: deleteSecondFactorWebAuthnCredentialRegistration
      tags:
      - Authentication
      summary: WebAuthn Credential Registration (Attestation)
      description: The WebAuthn Register endpoint removes all WebAuthn registration data from the session.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
  /api/secondfactor/webauthn/credential/{credentialID}:
    put:
      operationId: putSecondFactorWebAuthnCredential
      tags:
      - Authentication
      summary: WebAuthn Credential
      description: The WebAuthn credential endpoint updates the description of the specified WebAuthn credential.
      parameters:
      - $ref: '#/components/parameters/credentialID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webauthn.CredentialUpdateRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    delete:
      operationId: deleteSecondFactorWebAuthnCredential
      tags:
      - Authentication
      summary: WebAuthn Credential
      description: The WebAuthn credential endpoint deletes the specified WebAuthn credential from the database.
      parameters:
      - $ref: '#/components/parameters/credentialID'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
  /api/secondfactor/duo:
    get:
      operationId: getSecondFactorDuo
      tags:
      - Authentication
      summary: Second Factor Authentication - Duo Mobile Push
      description: This endpoint retrieves the users preferred Duo device and method.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.DuoDevicesResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
      security:
      - authelia_auth: []
    post:
      operationId: postSecondFactorDuo
      tags:
      - Authentication
      summary: Second Factor Authentication - Duo Mobile Push
      description: This endpoint performs second factor authentication with a Duo Mobile Push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.bodySignDuoRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.redirectResponse'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.KO'
          headers:
            Retry-After:
              schema:
                type: string
                format: http-date
              description: The date time that the request can be retried.
      security:
      - authelia_auth: []
  /api/secondfactor/duo_devices:
    get:
      operationId: getSecondFactorDuoDevices
      tags:
      - Authentication
      summary: Second Factor Authentication - Duo Mobile Push
      description: This endpoint retrieves a users available devices and capabilities from Duo.
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.DuoDevicesResponse'
        '401':
          description: Unauthorized
      security:
      - authelia_auth: []
  /api/secondfactor/duo_device:
    post:
      operationId: postSecondFactorDuoDevice
      tags:
      - Authentication
      summary: Second Factor Authentication - Duo Mobile Push
      description: This endpoint updates the users preferred Duo device and method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.DuoDeviceBody'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '401':
          description: Unauthorized
      security:
      - authelia_auth: []
  /api/secondfactor/password:
    post:
      operationId: postSecondFactorPassword
      tags:
      - Authentication
      summary: Second Factor Authentication - Password
      description: This endpoint performs 2FA via the users password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/handlers.bodyPasswordRequest'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/middlewares.Response.OK'
        '401':
          description: Unauthorized
      security:
      - authelia_auth: []
components:
  schemas:
    webauthn.Credential:
      description: A WebAuthn credential registered by the user.
      type: object
      properties:
        id:
          description: The identifier of the credential.
          type: integer
          examples:
          - 1
        created_at:
          description: The time this credential was created.
          type: string
          format: date-time
        last_used_at:
          description: The last time this credential was used, omitted if it has never been used.
          type: string
          format: date-time
        rpid:
          description: The Relying Party ID used to register this credential.
          type: string
          examples:
          - auth.example.com
        username:
          description: The username of the user this credential belongs to.
          type: string
          examples:
          - john
        description:
          description: The user description of this credential.
          type: string
          examples:
          - My Main Credential
        kid:
          description: The Public Key ID of this credential.
          type: string
          contentEncoding: base64
        aaguid:
          description: 'The Authenticator Attestation Global Unique Identifier of this credential, omitted if it''s not known.

            '
          type: string
          format: uuid
        attestation_type:
          description: The attestation type this credential uses.
          type: string
          examples:
          - packed
        attestation_format:
          description: The attestation format this credential uses.
          type: string
        attachment:
          description: The last recorded credential attachment type.
          type: string
          examples:
          - cross-platform
        transports:
          description: The last recorded credential transports.
          type: array
          items:
            type: string
          examples:
          - - usb
            - nfc
        sign_count:
          description: The last recorded credential sign count.
          type: integer
        clone_warning:
          description: The clone warning status of this credential.
          type: boolean
        legacy:
          description: Indicates this credential may need to be registered again.
          type: boolean
        discoverable:
          description: The discoverable status of this credential.
          type: boolean
        present:
          description: The user presence status of this credential.
          type: boolean
        verified:
          description: The user verification status of this credential.
          type: boolean
        backup_eligible:
          description: The backup eligible status of this credential.
          type: boolean
        backup_state:
          description: The backup state of this credential.
          type: boolean
        public_key:
          description: The credential public key.
          type: string
          contentEncoding: base64
        attestation:
          description: The credential attestation information for auditing and validation.
          type: string
          contentEncoding: base64
    webauthn.PublicKeyCredentialAssertion:
      description: 'The FIDO2 WebAuthn credential assertion response as produced by the browser.

        '
      allOf:
      - $ref: '#/components/schemas/webauthn.PublicKeyCredential'
      - $ref: '#/components/schemas/webauthn.AuthenticationExtensionsClientOutputs'
      - type: object
        required:
        - response
        properties:
          response:
            allOf:
            - $ref: '#/components/schemas/webauthn.AuthenticatorResponse'
            - type: object
              required:
              - authenticatorData
              - signature
              properties:
                authenticatorData:
                  type: string
                  contentEncoding: base64url
                signature:
                  type: string
                  contentEncoding: base64url
                userHandle:
                  type: string
                  contentEncoding: base64url
    handlers.bodyPasswordRequest:
      required:
      - password
      type: object
      properties:
        password:
          type: string
          examples:
          - password
        targetURL:
          type: string
          examples:
          - https://home.example.com
        flowID:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
          examples:
          - 3ebcfbc5-b0fd-4ee0-9d3c-080ae1e7298c
        flow:
          type: string
          examples:
          - openid_connect
          enum:
          - openid_connect
        subflow:
          description: The name of the subflow if applicable.
          type: string
          examples:
          - device_authorization
          enum:
          - device_authorization
        userCode:
          description: The user code from the Device Authorization Flow if applicable.
          type: string
          examples:
          - XGQWWFMM
    handlers.bodyFirstFactorReauthenticateRequest:
      required:
      - password
      type: object
      properties:
        password:
          type: string
          examples:
          - password
        targetURL:
          type: string
          examples:
          - https://home.example.com
        requestMethod:
          type: string
          examples:
          - GET
        flowID:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}$
          examples:
          - 3ebcfbc5-b0fd-4ee0-9d3c-080ae1e7298c
        flow:
          type: string
          examples:
          - openid_connect
          enum:
          - openid_connect
        subflow:
          description: The name of the subflow if applicable.
          type: string
          examples:
          - device_authorization
          enum:
          - device_authorization
        userCode:
          description: The user code from the Device Authorization Flow if applicable.
          type: string
          examples:
          - XGQWWFMM
    webauthn.PublicKeyCredentialAttestation:
      description: 'The FIDO2 WebAuthn credential creation response as produced by the browser.

        '
      allOf:
