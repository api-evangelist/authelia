method: searched
source: https://www.authelia.com/configuration/miscellaneous/server-endpoint-rate-limits/
description: >-
  Authelia ships default per-endpoint rate limits, enabled by default, implemented as multiple overlapping
  token buckets per endpoint. These are anti-brute-force controls on a self-hosted server, not a commercial
  quota: they are per-deployment, configured by the operator, and every value below is the shipped default
  that the operator may raise, lower or disable. Distinct from Regulation, which silently bans users at the
  username/password form.
  REPLACES a 2026-05-04 bulk-sweep scaffold that recorded invented per-tier quotas and X-RateLimit-* headers
  Authelia does not send.
scope: per-endpoint, per-deployment
enforced_by: server (config key server.endpoints.rate_limits)
limit_count: 11
response:
  status_on_exhaustion: 429
  headers:
    limit: null
    remaining: null
    reset: null
    retry_after: null
  note: >-
    No rate-limit response headers are declared on any 429 response in the first-party contract
    (openapi/authelia-api-openapi.yml, 9 operations declare 429) and none are documented. A client cannot
    read its remaining budget; it must back off blindly for the bucket period.
