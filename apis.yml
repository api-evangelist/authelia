- aid: authelia:authelia-api
  name: Authelia API
  description: >
    The full first-party Authelia HTTP API — the portal, authorization, authentication, second factor,
    user information, session elevation, password reset/change and OpenID Connect 1.0 surfaces. Described by
    Authelia's own OpenAPI 3.2.0 contract (42 paths, 78 operations, 100 schemas), published in the Authelia
    repository at api/openapi.yml and served by each deployment. Authelia is self-hosted, so the base URL is
    the operator's own deployment host; auth.example.com is the default Authelia's own contract template uses.
