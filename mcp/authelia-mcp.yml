source: >-
  Derived from openapi/authelia-api-openapi.yml (the first-party Authelia OpenAPI 3.2.0 contract).
  Searched for an official server first: the authelia GitHub organization publishes no MCP repository,
  npm returns only third-party integrations (@berlm/expenseowl-authelia-mcp-server and similar community
  projects), and no hosted endpoint is documented anywhere on www.authelia.com.
description: >-
  CANDIDATE tool list only. Authelia ships no Model Context Protocol server of any kind — no hosted endpoint
  and no installable stdio package. The tools below are a proposal derived from real operationIds in the
  published contract so that an operator building an MCP front-end for their own deployment has a starting
  point. Nothing here is callable as written: every operation lives on the operator's own Authelia host and
  requires that deployment's session cookie or an OAuth 2.0 access token.
deployment:
